<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css">
<style>
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  :root{--blue:#1a73e8;--blue-l:#e8f0fe;--mut:#5f6368;--txt:#202124;--line:#e8eaed;--sh:0 1px 3px rgba(60,64,67,.3),0 4px 14px rgba(60,64,67,.15)}
  html,body{height:100%;margin:0;font-family:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--txt);-webkit-tap-highlight-color:transparent}
  #map{height:100%;width:100%;background:#e5e3df}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--blue);color:#fff;font-size:14px;font-weight:500;line-height:1.2;transition:filter .15s,background .15s}
  button:hover{filter:brightness(1.07)}
  button:active{transform:scale(.98)}
  .ib{background:#fff;color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
  .ib:hover{background:#f1f3f4;filter:none}
  .ib.on{background:var(--blue);color:#fff;box-shadow:none}
  .ib.on.red{background:#d93025}
  .sec{background:#f1f3f4;color:var(--txt)}
  .danger{background:#d93025}
  .shadow{box-shadow:var(--sh)}
  input,textarea,select{font-size:16px}

  /* Вхід */
  #login{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%,#3b82f6,transparent 50%),linear-gradient(135deg,#1a73e8,#0b2f6b)}
  .card{background:#fff;padding:34px 28px 28px;border-radius:20px;width:min(380px,92vw);text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.4)}
  .logo{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--blue-l);display:flex;align-items:center;justify-content:center;font-size:32px}
  .card h1{font-size:22px;margin:0 0 4px}
  .card p{color:var(--mut);margin:0 0 22px;font-size:14px}
  .card input{width:100%;padding:13px 14px;border:1px solid #dadce0;border-radius:12px;margin-bottom:6px;outline:none}
  .card input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #d2e3fc}
  .card button{width:100%;margin-top:8px;padding:13px;border-radius:12px}
  #err{color:#d93025;font-size:13px;min-height:18px}

  /* Пошук */
  #search{position:absolute;z-index:1000;top:12px;left:12px;width:min(360px,calc(100% - 24px));display:flex;align-items:center;background:#fff;border-radius:26px;padding:3px 6px 3px 18px}
  #search input{flex:1;border:0;outline:none;padding:10px 0;background:transparent;min-width:0}
  #search button{background:transparent;color:var(--blue);font-size:18px;padding:8px 10px;border-radius:50%}

  /* Верхня панель */
  #bar{position:absolute;z-index:1000;top:12px;right:12px;display:flex;gap:6px;background:#fff;border-radius:14px;padding:6px;align-items:center}
  .chip{padding:0 8px;font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
  #bar button{padding:9px 12px}
  #btnPub{position:relative}
  #btnPub.dirty::after{content:'';position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:50%;background:#f9ab00;border:2px solid #fff}
  #menuWrap{position:relative}
  #menu{position:absolute;top:calc(100% + 8px);right:0;min-width:240px;background:#fff;border-radius:14px;padding:6px;z-index:1200}
  .mi{display:block;width:100%;text-align:left;background:transparent;color:var(--txt);padding:11px 14px;font-size:14px;border-radius:9px;cursor:pointer}
  .mi:hover{background:#f1f3f4;filter:none}

  .leaflet-top.leaflet-left{margin-top:64px}
  .leaflet-bar{border:0 !important;border-radius:12px !important;box-shadow:var(--sh) !important;overflow:hidden}
  .leaflet-bar a{border-color:var(--line) !important}
  .leaflet-pm-toolbar .leaflet-buttons-control-button{width:36px;height:36px}
  .leaflet-control-scale-line{border-radius:0 0 6px 6px}

  /* Шари */
  #layersWrap{position:absolute;z-index:1000;left:12px;bottom:36px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  #layersPanel{background:#fff;border-radius:16px;padding:14px;width:min(290px,calc(100vw - 24px))}
  .ttl{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
  .basegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .bt{background:none;color:var(--txt);padding:0;font-size:12px;font-weight:500;text-align:center}
  .bt:hover{filter:none}
  .bt i{display:block;height:46px;border-radius:12px;border:2px solid transparent;margin-bottom:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
  .bt.on i{border-color:var(--blue)}
  .bt.on{color:var(--blue)}
  .sect{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  #lyList{max-height:26vh;overflow:auto}
  #layersPanel label{display:flex;gap:10px;align-items:center;font-size:14px;padding:5px 0;cursor:pointer;line-height:1.3}
  #layersPanel input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue);flex:none}
  #layersPanel small{color:var(--mut)}
  #layersPanel .ldel{margin-left:auto;padding:4px 8px;font-size:13px;background:transparent;color:#d93025;box-shadow:inset 0 0 0 1px #f3c5c1}
  .fab{width:44px;height:44px;border-radius:12px;font-size:20px;padding:0;background:#fff;color:var(--txt)}
  .fab:hover{background:#f1f3f4;filter:none}

  #doneBar{position:absolute;z-index:1100;left:50%;bottom:36px;transform:translateX(-50%);background:#fff;border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;font-size:13px;width:max-content;max-width:92vw}

  /* Повідомлення про помилку */
  #bugModal{position:fixed;inset:0;z-index:2500;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:12px}
  .mcard{background:#fff;border-radius:18px;padding:22px;width:min(440px,100%);max-height:94vh;overflow:auto}
  .mcard h2{margin:0 0 4px;font-size:19px}
  .mcard .mut{margin:0 0 6px;color:var(--mut);font-size:13px;line-height:1.4}
  .mcard label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 5px}
  .mcard textarea,.mcard input[type=text]{width:100%;padding:10px 12px;border:1px solid #dadce0;border-radius:10px;font:inherit;font-size:16px;outline:none}
  .mcard textarea:focus,.mcard input[type=text]:focus{border-color:var(--blue);box-shadow:0 0 0 3px #d2e3fc}
  .locrow{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mut)}
  .mcard .row{display:flex;gap:8px;margin-top:18px}
  .mcard .row button{flex:1;padding:11px}

  /* Спливаючі вікна */
  .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:var(--sh)}
  .leaflet-popup-content{margin:14px 16px;min-width:230px;max-width:78vw;max-height:55vh;overflow:auto}
  .view h3{margin:0 0 6px;font-size:17px}
  .view p{margin:0;white-space:pre-wrap;color:#3c4043;line-height:1.45}
  .ed label.h{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
  .ed input[type=text],.ed textarea,.ed select{width:100%;padding:9px 11px;border:1px solid #dadce0;border-radius:10px;font:inherit;font-size:16px;outline:none}
  .ed input:focus,.ed textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #d2e3fc}
  .ed input[type=range]{width:100%;accent-color:var(--blue)}
  .ed .row{display:flex;gap:8px;margin-top:14px}
  .ed .row button{flex:1}
  .sw{display:inline-block;width:26px;height:26px;margin:2px;border-radius:50%;cursor:pointer;border:3px solid transparent;box-shadow:0 0 0 1px #9aa0a6;vertical-align:middle}
  .sw.sel{border-color:#fff;box-shadow:0 0 0 2px var(--blue)}
  .ed input[type=color]{width:32px;height:28px;padding:0;border:0;background:none;vertical-align:middle;cursor:pointer}

  .pin{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5)}
  .lbl{transform:translate(-50%,-50%);white-space:nowrap;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000,0 0 6px #000}
  body.texting #map,body.picking #map{cursor:crosshair}
  body.deleting .leaflet-interactive{cursor:pointer !important}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:5000;background:#323232;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;max-width:92vw;box-shadow:var(--sh)}
  #toast.err{background:#d93025}
  #toast button{margin-left:12px;background:#8ab4f8;color:#202124;padding:6px 12px}

  /* Телефон */
  @media(max-width:760px){
    #search{right:12px;width:auto}
    #bar{top:64px}
    .lab{display:none}
    .leaflet-control-zoom{display:none}
    #layersWrap{bottom:34px}
    #doneBar{bottom:96px;flex-direction:column;text-align:center;gap:8px}
    #toast{bottom:96px}
    .leaflet-pm-toolbar .leaflet-buttons-control-button{width:40px;height:40px}
  }
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="logo">🗺️</div>
    <h1>Карта</h1>
    <p>Росія та Україна</p>
    <input id="code" type="password" placeholder="Код адміністратора" autocomplete="off">
    <div id="err"></div>
    <button id="btnAdmin">Увійти як адмін</button>
    <button id="btnGuest" class="sec">Продовжити як відвідувач</button>
  </div>
</div>

<div id="map"></div>

<div id="search" class="shadow" hidden>
  <input id="q" placeholder="Пошук місця">
  <button id="btnQ" title="Шукати">🔍</button>
</div>

<div id="bar" class="shadow" hidden>
  <span class="chip" id="badge"></span>
  <button id="btnText" class="ib adm" title="Додати текст на карту">Аа<span class="lab"> Текст</span></button>
  <button id="btnDel" class="ib adm red" title="Режим видалення: клік по фігурі її видаляє">🗑<span class="lab"> Видалити</span></button>
  <button id="btnPub" class="adm" title="Опублікувати зміни для всіх">💾<span class="lab"> Опублікувати</span></button>
  <button id="btnBug" class="ib" title="Повідомити про помилку на карті">🐞<span class="lab"> Помилка</span></button>
  <div id="menuWrap">
    <button id="btnMenu" class="ib" title="Меню">⋯</button>
    <div id="menu" class="shadow" hidden>
      <button class="mi adm" id="btnUndo">↩ Скасувати видалення</button>
      <button class="mi adm" id="btnMyMaps">📥 Імпорт з Google My Maps</button>
      <label class="mi adm">📂 Імпорт KML-файлу<input id="fileKml" type="file" accept=".kml,.xml" hidden></label>
      <button class="mi adm" id="btnReset">↺ Скинути чернетку</button>
      <button class="mi" id="btnLogout">🚪 Вийти</button>
    </div>
  </div>
</div>

<div id="layersWrap" hidden>
  <div id="layersPanel" class="shadow">
    <div class="ttl">Тип карти</div>
    <div class="basegrid">
      <button id="bMap" class="bt on"><i style="background:linear-gradient(135deg,#e6efd9,#fff 55%,#cfe3f5)"></i>Карта</button>
      <button id="bLight" class="bt"><i style="background:linear-gradient(135deg,#f2f2f2,#fff,#e4e4e4)"></i>Світла</button>
      <button id="bSat" class="bt"><i style="background:linear-gradient(135deg,#2f4a2a,#5a6b3c 50%,#1f3a52)"></i>Супутник</button>
    </div>
    <div class="sect" id="lySec" hidden><div class="ttl">Шари карти</div><div id="lyList"></div></div>
    <div class="sect">
      <label><input type="checkbox" id="chkOcc"><span>Контур DeepState<br><small id="occInfo">натисніть, щоб показати</small></span></label>
    </div>
  </div>
  <button id="btnLayers" class="fab shadow" title="Шари">🗂</button>
</div>

<div id="doneBar" class="shadow" hidden>
  <span>Тягніть вершини. Середні точки додають нові, правий клік по вершині видаляє.</span>
  <button id="btnDone">Готово</button>
</div>

<div id="bugModal" hidden>
  <div class="mcard shadow">
    <h2>🐞 Повідомити про помилку</h2>
    <p class="mut">Опишіть, що не так із картою: неправильна межа, зникла фігура, помилка в тексті тощо.</p>
    <label>Що сталося?</label>
    <textarea id="bugText" rows="4" maxlength="2000" placeholder="Опишіть проблему…"></textarea>
    <label>Місце на карті (необов'язково)</label>
    <div class="locrow"><button id="bugPick" class="sec">📍 Вказати на карті</button><span id="bugLoc">не вказано</span></div>
    <label>Як з вами зв'язатися (необов'язково)</label>
    <input id="bugContact" type="text" maxlength="120" placeholder="Email або Telegram">
    <input id="bugHp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">
    <div class="row"><button id="bugSend">Надіслати</button><button id="bugCancel" class="sec">Скасувати</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"></script>
<script>
/* ===== НАЛАШТУВАННЯ ===== */
// Код адміна: хеш SHA-256. Зараз код: admin123
// Новий хеш: F12 → Console:
//   crypto.subtle.digest('SHA-256',new TextEncoder().encode('НОВИЙ_КОД')).then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
const ADMIN_HASH = '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9';
const GH_OWNER = '';   // залиште порожніми для ваш-логін.github.io
const GH_REPO  = '';
// Куди надсилати повідомлення про помилки. Вставте адресу форми Formspree, наприклад:
//   const REPORT_URL = 'https://formspree.io/f/xxxxxxxx';
// Якщо порожньо, відкриється сторінка нової проблеми (Issue) у вашому репозиторії GitHub.
const REPORT_URL = '';
const MYMAPS_ID = '1gejF6m_NsZ9gfy_Ju5Ml4jraEIA4qzk';
const DATA_FILE = 'data.json';
const DRAFT_KEY = 'mapDraft_v4', TOKEN_KEY = 'ghToken_v1';
const COLORS = ['#ef4444','#f97316','#facc15','#22c55e','#3b82f6','#a855f7','#ffffff','#111111'];
const SIZES = {s:14,m:20,l:30};
const $ = id => document.getElementById(id);

/* ===== КАРТА ===== */
const map = L.map('map',{zoomControl:false,worldCopyJump:true}).setView([52.114,37.909],5);
L.control.zoom({position:'bottomright'}).addTo(map);
L.control.scale({imperial:false,position:'bottomright'}).addTo(map);
const baseMap = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap, © CARTO'});
const baseLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap, © CARTO'});
const satGroup = L.layerGroup([
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Esri, Maxar'}),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:18})]);
const bases={bMap:baseMap,bLight:baseLight,bSat:satGroup};
let curBase=baseMap;curBase.addTo(map);
Object.keys(bases).forEach(id=>{
  $(id).onclick=()=>{
    map.removeLayer(curBase);curBase=bases[id];curBase.addTo(map);
    Object.keys(bases).forEach(k=>$(k).classList.toggle('on',k===id));
  };
});
$('btnLayers').onclick=()=>{$('layersPanel').hidden=!$('layersPanel').hidden;};

/* ===== Контур DeepState (необов'язковий) ===== */
map.createPane('occ').style.zIndex=390;
const occLayer=L.geoJSON(null,{pane:'occ',interactive:false,style:{color:'#991b1b',weight:1.2,fillColor:'#dc2626',fillOpacity:.38}});
const occInfo=$('occInfo');let occLoaded=false;
function showOcc(gj,label){occLayer.clearLayers();occLayer.addData(gj);occInfo.textContent='Дані: DeepState · '+label;}
async function loadOccupied(){
  const R='https://raw.githubusercontent.com/cyterat/deepstate-map-data/main/data/deepstatemap_data_',now=Date.now();
  occInfo.textContent='завантаження…';
  for(let i=0;i<10;i++){
    const t=new Date(now-i*864e5),y=t.getUTCFullYear(),m=String(t.getUTCMonth()+1).padStart(2,'0'),d=String(t.getUTCDate()).padStart(2,'0');
    for(const n of [`${y}${m}${d}`,`${y}-${m}-${d}`]){
      try{const r=await fetch(`${R}${n}.geojson`);if(r.ok){showOcc(await r.json(),`${d}.${m}.${y}`);return;}}catch(e){}
    }
  }
  occInfo.textContent='не вдалося завантажити';
}
$('chkOcc').onchange=e=>{
  if(e.target.checked){occLayer.addTo(map);if(!occLoaded){occLoaded=true;loadOccupied();}}else map.removeLayer(occLayer);
};

/* ===== ОБ'ЄКТИ ===== */
const store=new L.FeatureGroup().addTo(map);
let items=[],isAdmin=false,textMode=false,deleteMode=false;const hidden=new Set();
const undoStack=[];
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pinIcon(c){return L.divIcon({className:'',html:`<div class="pin" style="background:${c}"></div>`,iconSize:[22,22],iconAnchor:[11,22],popupAnchor:[0,-22]});}
function textIcon(it){return L.divIcon({className:'',html:`<div class="lbl" style="color:${it.color};font-size:${SIZES[it.size]||20}px">${esc(it.title)||'Текст'}</div>`,iconSize:[0,0]});}
function coordsOf(l){
  if(l instanceof L.Marker){const p=l.getLatLng();return [+p.lat.toFixed(6),+p.lng.toFixed(6)];}
  const f=a=>Array.isArray(a)?a.map(f):[+a.lat.toFixed(6),+a.lng.toFixed(6)];
  return f(l.getLatLngs());
}
function makeLayer(it){
  let l;
  if(it.type==='marker')l=L.marker(it.coords,{icon:pinIcon(it.color)});
  else if(it.type==='text')l=L.marker(it.coords,{icon:textIcon(it)});
  else if(it.type==='polygon')l=L.polygon(it.coords,{color:it.color,weight:it.w||3,fillColor:it.fc||it.color,fillOpacity:it.fill==null?.3:it.fill});
  else l=L.polyline(it.coords,{color:it.color,weight:it.w||4});
  l._id=it.id;
  if(it.type!=='text'||isAdmin)l.bindPopup(()=>isAdmin?editor(it):viewer(it),{maxWidth:320});
  const upd=()=>{it.coords=coordsOf(l);saveDraft();};
  l.on('pm:edit',upd);l.on('pm:dragend',upd);
  if(isAdmin){
    l.on('click',e=>{if(deleteMode){L.DomEvent.stopPropagation(e);l.closePopup();delItems([it]);}});
    l.on('mouseover',()=>{if(deleteMode&&l.setStyle)l.setStyle({color:'#d93025',fillColor:'#d93025'});});
    l.on('mouseout',()=>{if(l.setStyle)l.setStyle(it.type==='polygon'?{color:it.color,fillColor:it.fc||it.color}:{color:it.color});});
  }
  return l;
}
function render(rebuild=true){
  store.clearLayers();
  items.filter(it=>!hidden.has(it.layer||'')).forEach(it=>store.addLayer(makeLayer(it)));
  if(rebuild)buildLayers();
}
function buildLayers(){
  const box=$('lyList');box.innerHTML='';
  const names=[...new Set(items.map(i=>i.layer||''))];
  if(names.length===1&&names[0]===''){$('lySec').hidden=true;return;}
  $('lySec').hidden=false;
  names.forEach(n=>{
    const c=items.filter(i=>(i.layer||'')===n).length;
    const lb=document.createElement('label');
    lb.innerHTML=`<input type="checkbox" ${hidden.has(n)?'':'checked'}><span>${esc(n||'Без шару')} <small>(${c})</small></span>${isAdmin?'<button class="ldel" title="Видалити весь шар">🗑</button>':''}`;
    lb.querySelector('input').onchange=e=>{e.target.checked?hidden.delete(n):hidden.add(n);render(false);};
    const del=lb.querySelector('.ldel');
    if(del)del.onclick=e=>{
      e.preventDefault();

      delItems(items.filter(i=>(i.layer||'')===n));
    };
    box.appendChild(lb);
  });
}

/* ===== ВИДАЛЕННЯ І СКАСУВАННЯ ===== */
function delItems(list){
  const rec=list.map(it=>({it,i:items.indexOf(it)})).filter(r=>r.i>=0).sort((a,b)=>a.i-b.i);
  if(!rec.length)return;
  items=items.filter(x=>!list.includes(x));
  undoStack.push(rec);saveDraft();render();
  toast(rec.length>1?`Видалено об'єктів: ${rec.length}`:`Видалено: ${rec[0].it.title||'об\'єкт'}`,false,{label:'Скасувати',fn:undo});
}
function undo(){
  const rec=undoStack.pop();
  if(!rec){toast('Нема що скасовувати');return;}
  rec.forEach(r=>items.splice(Math.min(r.i,items.length),0,r.it));
  saveDraft();render();toast('Відновлено');
}

/* ===== ІМПОРТ З GOOGLE MY MAPS (KML) ===== */
const kmlColor=c=>(!c||c.length<8)?null:{hex:'#'+c.slice(6,8)+c.slice(4,6)+c.slice(2,4),a:parseInt(c.slice(0,2),16)/255};
const plain=h=>new DOMParser().parseFromString((h||'').replace(/<br\s*\/?>/gi,'\n'),'text/html').body.textContent.trim();
function parseKML(text){
  const doc=new DOMParser().parseFromString(text,'text/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('xml');
  const tx=(el,t)=>{const e=el&&el.getElementsByTagName(t)[0];return e?e.textContent.trim():null;};
  const kid=(el,t)=>[...el.children].find(n=>n.nodeName===t);
  const readStyle=s=>({
    line:kmlColor(tx(kid(s,'LineStyle'),'color')),lw:parseFloat(tx(kid(s,'LineStyle'),'width'))||null,
    poly:kmlColor(tx(kid(s,'PolyStyle'),'color')),fill:tx(kid(s,'PolyStyle'),'fill'),
    icon:kmlColor(tx(kid(s,'IconStyle'),'color'))});
  const styles={},smaps={};
  [...doc.getElementsByTagName('Style')].forEach(s=>{const id=s.getAttribute('id');if(id)styles[id]=readStyle(s);});
  [...doc.getElementsByTagName('StyleMap')].forEach(m=>{
    [...m.getElementsByTagName('Pair')].forEach(p=>{if(tx(p,'key')==='normal')smaps[m.getAttribute('id')]=(tx(p,'styleUrl')||'').replace('#','');});});
  const getSt=u=>{let id=(u||'').replace('#','');if(smaps[id])id=smaps[id];return styles[id]||{};};
  const pts=s=>(s||'').trim().split(/\s+/).map(c=>c.split(',')).filter(a=>a.length>=2&&!isNaN(a[0])&&!isNaN(a[1])).map(a=>[+(+a[1]).toFixed(6),+(+a[0]).toFixed(6)]);
  const rings=p=>{
    const r=[],o=p.getElementsByTagName('outerBoundaryIs')[0];
    if(o)r.push(pts(tx(o,'coordinates')));
    [...p.getElementsByTagName('innerBoundaryIs')].forEach(i=>r.push(pts(tx(i,'coordinates'))));
    return r.filter(x=>x.length>2);
  };
  const out=[];
  [...doc.getElementsByTagName('Placemark')].forEach(pm=>{
    let f=pm.parentNode,layer='';
    while(f&&f.nodeType===1){if(f.nodeName==='Folder'){const n=kid(f,'name');layer=n?n.textContent.trim():'';break;}f=f.parentNode;}
    const inl=kid(pm,'Style'),su=kid(pm,'styleUrl');
    const st=inl?readStyle(inl):getSt(su?su.textContent.trim():'');
    const nm=kid(pm,'name'),ds=kid(pm,'description');
    const base={title:nm?nm.textContent.trim():'',desc:plain(ds?ds.textContent:''),layer};
    const polys=[...pm.getElementsByTagName('Polygon')].map(rings).filter(r=>r.length);
    if(polys.length){
      const lc=st.line||st.poly,pc=st.poly||st.line;
      out.push({...base,id:uid(),type:'polygon',coords:polys.length===1?polys[0]:polys,
        color:lc?lc.hex:'#1a73e8',fc:pc?pc.hex:'#1a73e8',fill:st.fill==='0'?0:(st.poly?st.poly.a:.3),w:st.lw||2});
    }
    const lines=[...pm.getElementsByTagName('LineString')].map(l=>pts(tx(l,'coordinates'))).filter(a=>a.length>1);
    if(lines.length)out.push({...base,id:uid(),type:'line',coords:lines.length===1?lines[0]:lines,color:st.line?st.line.hex:'#1a73e8',w:st.lw||3});
    [...pm.getElementsByTagName('Point')].forEach(p=>{
      const c=pts(tx(p,'coordinates'))[0];
      if(c)out.push({...base,id:uid(),type:'marker',coords:c,color:st.icon?st.icon.hex:'#ef4444'});
    });
  });
  return out;
}
function applyKML(text){
  let imp;
  try{imp=parseKML(text);}catch(e){alert('Не вдалося прочитати файл KML.');return;}
  if(!imp.length){alert('У файлі не знайдено об\'єктів.');return;}
  const replace=confirm(`Знайдено об'єктів: ${imp.length}.\n\nOK — ЗАМІНИТИ всі поточні об'єкти імпортованими.\nСкасувати — ДОДАТИ до існуючих.`);
  items=replace?imp:items.concat(imp);
  hidden.clear();undoStack.length=0;saveDraft();render();
  try{map.fitBounds(store.getBounds(),{maxZoom:8});}catch(e){}
  toast(`Імпортовано: ${imp.length}. Тепер їх можна редагувати. Щоб побачили всі, натисніть «Опублікувати».`);
}

const btnPub=$('btnPub');
function toast(msg,err,act){
  let t=$('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.whiteSpace='pre-line';document.body.appendChild(t);}
  t.textContent=msg;t.className=err?'err':'';t.hidden=false;
  if(act){
    const b=document.createElement('button');b.textContent=act.label;
    b.onclick=()=>{t.hidden=true;act.fn();};
    t.appendChild(b);
  }
  clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,err?15000:act?9000:5000);

function refreshDirty(){
  const dirty=!!localStorage.getItem(DRAFT_KEY);
  btnPub.classList.toggle('dirty',dirty);
  btnPub.title=dirty?'Є неопубліковані зміни':'Опублікувати зміни для всіх';

function saveDraft(){
  try{localStorage.setItem(DRAFT_KEY,JSON.stringify(items));}
  catch(e){toast('Чернетка завелика для браузера. Натисніть «Опублікувати», поки не закрили сторінку.',true);}
  refreshDirty();
}
function ghRepo(){
  if(GH_OWNER&&GH_REPO)return [GH_OWNER,GH_REPO];
  const h=location.hostname;
  if(h.endsWith('.github.io')){const p=location.pathname.split('/')[1];return [h.split('.')[0],(p&&!p.includes('.'))?p:h];}
  return null;
}
async function fetchPublished(){
  const r=ghRepo();
  if(r){
    try{
      const res=await fetch(`https://api.github.com/repos/${r[0]}/${r[1]}/contents/${DATA_FILE}`,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'});
      if(res.ok)return await res.json();
    }catch(e){}
  }
  try{const res=await fetch(DATA_FILE+'?t='+Date.now());if(res.ok)return await res.json();}catch(e){}
  return [];
}
async function loadData(){
  const pub=await fetchPublished();
  items=Array.isArray(pub)?pub:[];
  if(isAdmin){
    const d=localStorage.getItem(DRAFT_KEY);
    if(d){try{items=JSON.parse(d);}catch(e){}}
    refreshDirty();
  }
  render();
}
btnPub.onclick=async()=>{
  const r=ghRepo();
  if(!r){alert('Не вдалося визначити репозиторій. Впишіть GH_OWNER і GH_REPO на початку скрипта.');return;}
  let tk=localStorage.getItem(TOKEN_KEY);
  if(!tk){
    tk=prompt('Вставте GitHub-токен (fine-grained, доступ Contents: Read and write до цього репозиторію).\nВін збережеться тільки у вашому браузері:');
    if(!tk)return;tk=tk.trim();localStorage.setItem(TOKEN_KEY,tk);
  }
  const url=`https://api.github.com/repos/${r[0]}/${r[1]}/contents/${DATA_FILE}`;
  const H={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
  toast('Публікація…');
  try{
    let sha;
    const g=await fetch(url,{headers:H,cache:'no-store'});
    if(g.status===200)sha=(await g.json()).sha;else if(g.status!==404)throw g.status;
    const body={message:'Оновлення карти',content:btoa(unescape(encodeURIComponent(JSON.stringify(items)))),sha};
    const p=await fetch(url,{method:'PUT',headers:H,body:JSON.stringify(body)});
    if(!p.ok)throw p.status;
    localStorage.removeItem(DRAFT_KEY);refreshDirty();
    toast('✅ Опубліковано! Відвідувачі бачать зміни одразу.');
  }catch(e){
    if(e===401||e===403||e===404)localStorage.removeItem(TOKEN_KEY);
    toast('❌ Помилка '+e+'. Перевірте токен: потрібен доступ Contents: Read and write до цього репозиторію. Спробуйте ще раз.',true);
  }
};

/* ===== ВХІД ===== */
async function sha(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

  document.querySelectorAll('.adm').forEach(e=>e.hidden=!admin);
  if(admin)enableTools();
  await loadData();
}

const role=sessionStorage.getItem('role');
if(role==='admin')start(true);else if(role==='guest')start(false);
</script>
